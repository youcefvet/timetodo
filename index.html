<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إنجازاتي - مهامي وتنبيهاتي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 12px; display: flex; justify-content: center; }
    .app-card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px; padding: 18px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.07); border: 1px solid #e2e8f0; }
    
    /* Header */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9; }
    .header h1 { font-size: 19px; font-weight: 800; color: #0f766e; }
    .badge-counter { background: #ccfbf1; color: #0f766e; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 12px; }

    /* Inputs */
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; }
    input[type="text"], input[type="date"], input[type="time"] { width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s; background: #fff; }
    input:focus { border-color: #0d9488; }
    .row-2 { display: flex; gap: 8px; }
    .row-2 > div { flex: 1; }

    /* Custom Reminder Box */
    .reminder-box { background: #f0fdfa; border: 1.5px solid #99f6e4; border-radius: 14px; padding: 12px; margin-bottom: 14px; }
    .reminder-title { font-size: 12px; font-weight: 700; color: #115e59; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
    .unit-card { background: #ffffff; border: 1px solid #ccfbf1; border-radius: 10px; padding: 6px 4px; }
    .unit-card span { display: block; font-size: 11px; color: #64748b; margin-bottom: 3px; }
    .unit-card input { width: 100%; text-align: center; font-weight: 800; font-size: 15px; border: none; background: transparent; outline: none; }

    /* Buttons */
    .btn-add { width: 100%; padding: 13px; background: #0d9488; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.15s; }
    .btn-add:active { transform: scale(0.98); background: #0f766e; }

    /* Tasks List */
    .list-title { font-size: 14px; font-weight: 700; color: #334155; margin: 18px 0 10px; }
    .tasks-container { display: flex; flex-direction: column; gap: 8px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 12px; gap: 10px; }
    .task-item.completed { background: #f1f5f9; opacity: 0.7; }
    .task-item.completed .task-text { text-decoration: line-through; color: #94a3b8; }
    .task-right { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .task-check { width: 20px; height: 20px; accent-color: #0d9488; cursor: pointer; }
    .task-text { font-size: 14px; font-weight: 600; word-break: break-word; }
    .task-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
    .tag { font-size: 10px; font-weight: 700; background: #e0f2fe; color: #0284c7; padding: 2px 6px; border-radius: 6px; }
    .tag-rem { background: #fef3c7; color: #d97706; }
    .btn-del { background: #fee2e2; color: #dc2626; border: none; padding: 6px 10px; font-size: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    .empty-state { text-align: center; color: #94a3b8; font-size: 13px; padding: 25px 0; }
  </style>
</head>
<body>

<div class="app-card">
  <!-- رأس الصفحة -->
  <div class="header">
    <h1>📋 إنجازاتي</h1>
    <div class="badge-counter" id="statsCount">0 / 0 منجز</div>
  </div>

  <!-- إضافة مهمة -->
  <div class="input-group">
    <label>عنوان المهمة</label>
    <input type="text" id="taskTitle" placeholder="مثال: مراجعة التقرير، قراءة ورد..." />
  </div>

  <div class="row-2 input-group">
    <div>
      <label>التاريخ</label>
      <input type="date" id="taskDate" />
    </div>
    <div>
      <label>الوقت</label>
      <input type="time" id="taskTime" />
    </div>
  </div>

  <!-- لوحة التنبيه المخصص -->
  <div class="reminder-box">
    <div class="reminder-title">
      <span>⏱️ وقت التنبيه قبل الموعد:</span>
      <span id="previewSummary" style="color:#0d9488;">(0 دقيقة)</span>
    </div>
    <div class="grid-3">
      <div class="unit-card">
        <span>الأيام</span>
        <input type="number" id="remDays" min="0" max="30" value="0" oninput="updateSummary()">
      </div>
      <div class="unit-card">
        <span>الساعات</span>
        <input type="number" id="remHours" min="0" max="23" value="0" oninput="updateSummary()">
      </div>
      <div class="unit-card">
        <span>الدقائق</span>
        <input type="number" id="remMins" min="0" max="59" value="15" oninput="updateSummary()">
      </div>
    </div>
  </div>

  <button class="btn-add" onclick="addTask()">+ حفظ وإضافة المهمة</button>

  <!-- قائمة المهام -->
  <div class="list-title">قائمة المهام اليومية:</div>
  <div class="tasks-container" id="tasksList"></div>
</div>

<script>
  // تهيئة التاريخ لليوم تلقائياً
  document.getElementById('taskDate').valueAsDate = new Date();

  // تحميل المهام المحفوظة محلياً
  let tasks = JSON.parse(localStorage.getItem('my_tasks_app_data') || '[]');

  function updateSummary() {
    const d = parseInt(document.getElementById('remDays').value) || 0;
    const h = parseInt(document.getElementById('remHours').value) || 0;
    const m = parseInt(document.getElementById('remMins').value) || 0;
    if (d === 0 && h === 0 && m === 0) {
      document.getElementById('previewSummary').textContent = 'في نفس الموعد بالضبط';
      return;
    }
    let parts = [];
    if (d > 0) parts.push(d + ' يوم');
    if (h > 0) parts.push(h + ' ساعة');
    if (m > 0) parts.push(m + ' دقيقة');
    document.getElementById('previewSummary').textContent = 'قبل ' + parts.join(' و ');
  }

  function renderTasks() {
    localStorage.setItem('my_tasks_app_data', JSON.stringify(tasks));
    const container = document.getElementById('tasksList');
    container.innerHTML = '';

    const completedCount = tasks.filter(t => t.completed).length;
    document.getElementById('statsCount').textContent = `${completedCount} / ${tasks.length} منجز`;

    if (tasks.length === 0) {
      container.innerHTML = '<div class="empty-state">لا توجد مهام حالياً. أضف مهمتك الأولى بالأعلى!</div>';
      return;
    }

    tasks.forEach((task, index) => {
      let remText = '';
      if (task.remDays > 0 || task.remHours > 0 || task.remMins > 0) {
        let p = [];
        if (task.remDays > 0) p.push(task.remDays + 'ي');
        if (task.remHours > 0) p.push(task.remHours + 'س');
        if (task.remMins > 0) p.push(task.remMins + 'د');
        remText = 'قبل ' + p.join(' ');
      }

      const item = document.createElement('div');
      item.className = 'task-item ' + (task.completed ? 'completed' : '');
      item.innerHTML = `
        <div class="task-right">
          <input type="checkbox" class="task-check" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
          <div>
            <div class="task-text">${task.title}</div>
            <div class="task-tags">
              ${task.date ? `<span class="tag">📅 ${task.date}</span>` : ''}
              ${task.time ? `<span class="tag">🕒 ${task.time}</span>` : ''}
              ${remText ? `<span class="tag tag-rem">🔔 ${remText}</span>` : ''}
            </div>
          </div>
        </div>
        <button class="btn-del" onclick="deleteTask(${index})">حذف</button>
      `;
      container.appendChild(item);
    });
  }

  function addTask() {
    const titleInput = document.getElementById('taskTitle');
    const title = titleInput.value.trim();
    if (!title) {
      alert('يرجى كتابة عنوان المهمة أولاً');
      return;
    }

    const newTask = {
      id: Date.now(),
      title: title,
      date: document.getElementById('taskDate').value,
      time: document.getElementById('taskTime').value,
      remDays: parseInt(document.getElementById('remDays').value) || 0,
      remHours: parseInt(document.getElementById('remHours').value) || 0,
      remMins: parseInt(document.getElementById('remMins').value) || 0,
      completed: false
    };

    tasks.unshift(newTask);
    titleInput.value = '';
    renderTasks();
  }

  function toggleTask(index) {
    tasks[index].completed = !tasks[index].completed;
    renderTasks();
  }

  function deleteTask(index) {
    if (confirm('هل تريد حذف هذه المهمة؟')) {
      tasks.splice(index, 1);
      renderTasks();
    }
  }

  // طلب إذن الإشعارات والتنبيه التلقائي
  if ('Notification' in window && Notification.permission !== 'granted') {
    Notification.requestPermission();
  }

  setInterval(() => {
    const now = new Date().getTime();
    tasks.forEach(t => {
      if (!t.completed && !t.notified && t.date && t.time) {
        const due = new Date(`${t.date}T${t.time}`).getTime();
        const offsetMs = ((t.remDays * 1440) + (t.remHours * 60) + t.remMins) * 60000;
        const triggerTime = due - offsetMs;
        if (now >= triggerTime && (now - triggerTime) < 60000) {
          t.notified = true;
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('⏰ موعد المهمة: ' + t.title, { body: `الموعد: ${t.time}` });
          } else {
            alert('⏰ تنبيه لمهمتك: ' + t.title);
          }
          renderTasks();
        }
      }
    });
  }, 10000);

  updateSummary();
  renderTasks();
</script>

</body>
</html>
