  <meta property="og:title" content="منظّم المهمات اليومية" />
  <meta property="og:image" content="/icon.jpg" />
  <meta property="og:description" content="تطبيق لتنظيم المهمات اليومية مع شريط قابل للتمرير، وخاصية التذكير والإشعارات، ودعم 5 لغات." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          }
        }
      }
    };

  <style>
    body { font-family: 'Cairo', sans-serif; }

    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .thin-scrollbar::-webkit-scrollbar { height: 6px; }
    .thin-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

<body class="bg-slate-50/80 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800 sticky top-0 z-30 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center">
        <img id="app-brand-icon" src="/icon.jpg" alt="Icon" class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl shadow-xs select-none object-cover" />
      </div>

      <div class="flex items-center gap-2 sm:gap-2.5">
        <!-- PRO Badge & Settings -->
        <div class="flex items-center gap-1.5" id="pro-header-actions">
          <button id="pro-badge-btn" type="button" class="hidden px-2.5 py-1.5 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 text-xs font-bold items-center gap-1.5 transition cursor-pointer">
            <span>👑</span> <span id="pro-badge-text">PRO</span>
          </button>
          <button id="open-config-btn" type="button" title="إعدادات الميزة المدفوعة" class="p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-amber-600 text-xs transition cursor-pointer">
            👑
          </button>
        </div>

        <!-- Today's Stats Badge -->
        <div id="header-today-stats" class="flex items-center gap-1.5 text-xs font-bold bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-full border border-emerald-200/60 shrink-0">
          <span>✓</span> <span id="today-stats-counter">0/0</span>
        </div>

        <!-- Language Selector -->
        <div class="relative">
          <button id="lang-menu-btn" type="button" class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer">
            <span id="current-lang-flag">🇸🇦</span>
            <span id="current-lang-name" class="hidden sm:inline">العربية</span>
          </button>
          <div id="lang-dropdown" class="hidden absolute left-0 rtl:left-0 ltr:right-0 mt-2 w-36 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl py-1 z-50"></div>
        </div>

        <!-- Notification Bell & Dropdown -->
        <div class="relative">
          <button id="bell-btn" type="button" class="relative p-2 rounded-xl border transition cursor-pointer bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100">
            <span class="text-base">🔔</span>
            <span id="bell-badge" class="hidden absolute -top-1.5 -right-1.5 px-1.5 py-0.2 text-[10px] font-bold bg-amber-600 text-white rounded-full min-w-4 text-center">0</span>
          </button>

          <!-- Descending Notification Center Dropdown -->
          <div id="notification-dropdown" class="hidden absolute top-full mt-2 left-0 rtl:left-0 ltr:right-0 w-[calc(100vw-2rem)] max-w-sm sm:w-96 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-2xl space-y-3 z-50">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2.5 text-xs">
              <div class="flex items-center gap-2">
                <span class="p-1 rounded-lg bg-amber-50 text-amber-600">🔔</span>
                <span id="notif-header-title" class="font-bold text-slate-800 dark:text-slate-100">الإشعارات والتذكيرات</span>
              </div>
              <div class="flex items-center gap-1.5">
                <button id="mark-all-read-btn" class="text-emerald-700 text-[11px] font-semibold hover:underline">تحديد الكل كمقروء</button>
                <button id="clear-all-notifs-btn" class="text-slate-400 hover:text-rose-600 text-[11px]">مسح</button>
              </div>
            </div>
            <div id="notifications-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- Date Navigator Card -->
    <div id="date-navigator-card" class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 shadow-sm select-none">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-3 border-b border-slate-100 dark:border-slate-800">
        <div>
          <div class="flex items-center gap-2">
            <h2 id="current-date-full-label" class="text-lg font-bold text-slate-900 dark:text-white">...</h2>
            <span id="relative-date-tag" class="hidden text-xs px-2.5 py-0.5 rounded-full font-bold shadow-xs"></span>
            <span id="past-lock-icon" class="hidden p-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200" title="الأيام السابقة مقفلة للعرض فقط">🔒</span>
          </div>
          <p id="current-date-stats-label" class="text-xs text-slate-500 mt-0.5"></p>
        </div>

        <div class="flex items-center gap-1.5 self-end sm:self-auto">
          <button id="back-today-btn" type="button" class="hidden text-xs font-semibold px-2.5 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl hover:bg-emerald-100 transition cursor-pointer">
            ↺ اليوم
          </button>
          <div class="relative inline-block">
            <input id="native-date-picker" type="date" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer z-10" />
            <div class="p-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl text-xs font-medium cursor-pointer">📅</div>
          </div>
          <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-xl p-0.5">
            <button id="prev-day-btn" class="p-1.5 text-slate-600 hover:bg-white rounded-lg">◀</button>
            <button id="next-day-btn" class="p-1.5 text-slate-600 hover:bg-white rounded-lg">▶</button>
          </div>
        </div>
      </div>

      <!-- Draggable Days Tape -->
      <div class="relative mt-3 group">
        <div id="draggable-days-container" class="flex items-stretch gap-2.5 overflow-x-auto py-2 px-1 no-scrollbar cursor-grab active:cursor-grabbing"></div>
      </div>

      <!-- Day Completion Progress Bar -->
      <div id="day-progress-container" class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center gap-3">
        <div class="flex-1 bg-slate-100 dark:bg-slate-800 rounded-full h-2 overflow-hidden">
          <div id="day-progress-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="day-progress-text" class="text-xs font-semibold text-slate-700 dark:text-slate-300 shrink-0">0%</span>
      </div>
    </div>

    <!-- Habit Input Box -->
    <div id="habit-input-container"></div>

    <!-- Habits Horizontal Scroll Strip -->
    <div id="habits-section" class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2 flex-wrap text-xs font-bold text-slate-700 dark:text-slate-300">
          <span id="strip-title-count">شريط المهمات (0)</span>
          <span id="strip-completed-count" class="text-emerald-700 font-semibold flex items-center gap-1"></span>
          <span id="strip-locked-badge" class="hidden p-1 rounded-md bg-slate-100 text-slate-500 border border-slate-200">🔒</span>
        </div>
        <div id="strip-scroll-controls" class="flex items-center gap-1">
          <button id="scroll-right-btn" class="p-1.5 bg-white dark:bg-slate-900 border border-slate-200 rounded-lg hover:bg-slate-100">◀</button>
          <button id="scroll-left-btn" class="p-1.5 bg-white dark:bg-slate-900 border border-slate-200 rounded-lg hover:bg-slate-100">▶</button>
        </div>
      </div>

      <div id="habits-scroll-strip" class="flex items-stretch gap-3.5 overflow-x-auto pb-4 pt-1 px-1 thin-scrollbar scroll-smooth"></div>
    </div>

  </main>

    // State Variables

    // Date Utilities
    function formatToDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
    function parseDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function getTodayDateKey() {
      return formatToDateKey(new Date());
    }
    function isPastDate(key) {
      return key < getTodayDateKey();
    }
    function isMoreThan24HoursAhead(dateKey, timeStr) {
      const target = parseDateKey(dateKey);
      if (timeStr && timeStr.includes(':')) {
        const [h, m] = timeStr.split(':').map(Number);
        target.setHours(h, m, 0, 0);
      } else {
        target.setHours(9, 0, 0, 0);
      }
      return target.getTime() - Date.now() > 24 * 60 * 60 * 1000;
    }

    function normalizeText(text) {
      return (text || '').toLowerCase().replace(/[إأآا]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
    }

    // Storage Management
    function loadHabits() {
      try {
        const data = localStorage.getItem('habits_organizer_items_v2');
        if (data) return JSON.parse(data);
      } catch (e) {}
      const today = getTodayDateKey();
      return [
        { id: 'init-1', title: 'صلاة الفجر وقراءة أذكار الصباح', date: today, time: '05:30', completed: true, createdAt: 1000 },
        { id: 'init-2', title: 'تمارين رياضية صباحية (كارديو)', date: today, time: '07:00', completed: false, createdAt: 2000 },

        { id: 'init-4', title: 'شرب 2 لتر من الماء خلال اليوم', date: today, completed: false, createdAt: 4000 }
      ];
    }
    function saveHabits() {
      localStorage.setItem('habits_organizer_items_v2', JSON.stringify(habits));

      try {
        const data = localStorage.getItem('habits_organizer_suggestions_v2');

      return DEFAULT_SUGGESTIONS;

      localStorage.setItem('habits_organizer_suggestions_v2', JSON.stringify(suggestions));

    function loadNotifications() {
      try {
        const data = localStorage.getItem('habits_organizer_inapp_notifications_v1');
        if (data) return JSON.parse(data);

      return [];

    function saveNotifications() {
      localStorage.setItem('habits_organizer_inapp_notifications_v1', JSON.stringify(notifications));
    }

    // Record Usage
    function recordHabitUsage(title, time) {
      const clean = title.trim();
      if (!clean) return;
      const norm = normalizeText(clean);
      const idx = suggestions.findIndex(s => normalizeText(s.title) === norm);
      if (idx >= 0) {
        suggestions[idx].usageCount++;
        suggestions[idx].lastUsed = Date.now();
        if (time) suggestions[idx].defaultTime = time;
      } else {
        suggestions.unshift({ title: clean, defaultTime: time, usageCount: 1, lastUsed: Date.now() });
      }
      saveSuggestions();
    }

    // Stats
    function getDateStats(dateKey) {
      const dayHabits = habits.filter(h => h.date === dateKey);
      const total = dayHabits.length;
      const completed = dayHabits.filter(h => h.completed).length;
      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      return { total, completed, percentage };
    }

    // Date formatting helper
    function getFormattedDate(dateKey) {
      const d = parseDateKey(dateKey);
      const t = TRANSLATIONS[currentLang];
      const dayName = t.days[d.getDay()];
      const dayNum = d.getDate();
      const monthName = t.months[d.getMonth()];
      const year = d.getFullYear();
      const todayKey = getTodayDateKey();
      
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yKey = formatToDateKey(yesterday);

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomKey = formatToDateKey(tomorrow);

      let relativeLabel = '';
      if (dateKey === todayKey) relativeLabel = t.today;
      else if (dateKey === yKey) relativeLabel = t.yesterday;
      else if (dateKey === tomKey) relativeLabel = t.tomorrow;

      return {
        dayName,
        dayNum,
        monthName,
        year,
        fullDate: `${dayName}، ${dayNum} ${monthName} ${year}`,
        relativeLabel
      };
    }

    // Remaining time formatter
    function getRemainingTimeText(dateKey, timeStr) {
      const target = parseDateKey(dateKey);
      if (timeStr && timeStr.includes(':')) {
        const [h, m] = timeStr.split(':').map(Number);
        target.setHours(h, m, 0, 0);
      } else {
        target.setHours(9, 0, 0, 0);
      }
      const diffMs = target.getTime() - Date.now();
      if (diffMs <= 30000) return currentLang === 'ar' ? 'حان موعد المهمة الآن!' : 'Due now!';
      const totalMin = Math.round(diffMs / 60000);
      if (totalMin < 60) return currentLang === 'ar' ? `متبقي ${totalMin} دقيقة` : `${totalMin}m left`;
      if (totalMin < 1440) {
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        return currentLang === 'ar' ? `متبقي ${h} ساعة${m > 0 ? ' و ' + m + ' د' : ''}` : `${h}h ${m}m left`;
      }
      const days = Math.floor(totalMin / 1440);
      return currentLang === 'ar' ? `متبقي ${days} يوم` : `${days} days left`;
    }

      } else {
        relTag.classList.add('hidden');
      }

      const lockIcon = document.getElementById('past-lock-icon');

        lockIcon.classList.remove('hidden');

      document.getElementById('current-date-stats-label').textContent =
        stats.total > 0
          ? `${stats.completed} / ${stats.total} ${t.completed} (${stats.percentage}%)`
          : t.noHabits;

      const backTodayBtn = document.getElementById('back-today-btn');
      if (!isToday) {
        backTodayBtn.classList.remove('hidden');
        backTodayBtn.textContent = `↺ ${t.today}`;

        backTodayBtn.classList.add('hidden');
      }

      document.getElementById('native-date-picker').value = selectedDate;

      // Progress bar

      progBar.style.width = `${stats.percentage}%`;
      progText.textContent = `${stats.percentage}%`;

      // Draggable Tape Days List (-20 to +25 around today or selected)
      const container = document.getElementById('draggable-days-container');
      container.innerHTML = '';

      const base = parseDateKey(todayKey);
      const days = [];
      for (let i = -20; i <= 25; i++) {

        days.push(formatToDateKey(cur));

            <!-- Submit Button -->

      // Event Listeners for Input Box
      const titleInput = document.getElementById('habit-title-input');

      // Requirement: Do NOT show suggestions until first character is typed
      titleInput.addEventListener('input', (e) => {
        inputTitle = e.target.value;
        const trimmed = inputTitle.trim();
        if (trimmed.length >= 1) {
          const norm = normalizeText(trimmed);
          const matched = suggestions.filter(s => normalizeText(s.title).includes(norm)).slice(0, 6);
          if (matched.length > 0) {
            dropdown.innerHTML = matched.map((item, idx) => `
              <div onclick="selectSuggestion('${escapeHtml(item.title)}', '${item.defaultTime || ''}')" class="px-3.5 py-2 cursor-pointer hover:bg-emerald-50 dark:hover:bg-emerald-950/40 flex items-center justify-between text-xs border-b border-slate-100 last:border-0">

            `).join('');

          } else {
            dropdown.classList.add('hidden');
          }

          dropdown.classList.add('hidden');
        }

      document.addEventListener('click', (e) => {

            await Notification.requestPermission();
          }

      const addForm = document.getElementById('add-habit-form');

    window.selectSuggestion = function(title, defTime) {
      inputTitle = title;
      if (defTime && !inputTime) inputTime = defTime;
      renderHabitInputBox();
    };
    window.setHabitDays = function(daysArr) {
      inputHabitDays = daysArr;
      renderHabitInputBox();
    };
    window.toggleHabitDay = function(dayIdx) {
      if (inputHabitDays.includes(dayIdx)) {
        if (inputHabitDays.length > 1) inputHabitDays = inputHabitDays.filter(d => d !== dayIdx);
      } else {
        inputHabitDays.push(dayIdx);
        inputHabitDays.sort();
      }
      renderHabitInputBox();
    };
    window.setDurationPreset = function(val) {
      inputHabitDurationPreset = val;
      renderHabitInputBox();
    };
    window.setReminderOffset = function(val) {
      inputReminderOffset = val;
      renderHabitInputBox();
    };

    function submitHabitForm() {
      const cleanTitle = inputTitle.trim();
      if (!cleanTitle) return;

      if (inputHabitEnabled) {
        // Recurring series
        const durationDays = inputHabitDurationPreset === -1 ? inputHabitCustomVal : inputHabitDurationPreset;
        const groupId = 'grp_' + Date.now();
        const start = parseDateKey(selectedDate);
        const newItems = [];

        for (let i = 0; i < durationDays; i++) {
          const cur = new Date(start);
          cur.setDate(start.getDate() + i);
          if (inputHabitDays.length > 0 && !inputHabitDays.includes(cur.getDay())) continue;
          const curKey = formatToDateKey(cur);
          if (isPastDate(curKey)) continue;

          newItems.push({
            id: 'habit_' + Date.now() + '_' + i,
            title: cleanTitle,
            date: curKey,
            time: inputTime || undefined,
            completed: false,
            createdAt: Date.now(),
            isHabit: true,
            habitGroupId: groupId,
            habitDurationLabel: `${durationDays} ${TRANSLATIONS[currentLang].daysUnit}`
          });
        }

        if (newItems.length > 0) {
          habits.push(...newItems);
          saveHabits();
          recordHabitUsage(cleanTitle, inputTime);
        }
      } else {
        // Single Task
        const newHabit = {
          id: 'habit_' + Date.now(),
          title: cleanTitle,
          date: selectedDate,
          time: inputTime || undefined,
          completed: false,
          createdAt: Date.now(),
          reminderEnabled: Boolean(inputReminderEnabled && isMoreThan24HoursAhead(selectedDate, inputTime)),
          reminderOffsetMinutes: inputReminderOffset
        };
        habits.push(newHabit);
        saveHabits();
        recordHabitUsage(cleanTitle, inputTime);
      }

      inputTitle = '';
      inputTime = '';
      inputHabitEnabled = false;
      inputReminderEnabled = false;
      renderApp();
    }

    // Render Habits Strip
    function renderHabitsStrip() {
      const t = TRANSLATIONS[currentLang];
      const isPast = isPastDate(selectedDate);
      const stripContainer = document.getElementById('habits-scroll-strip');
      const dateHabits = habits
        .filter(h => h.date === selectedDate)
        .sort((a, b) => {
          if (a.time && b.time) return a.time.localeCompare(b.time);
          if (a.time && !b.time) return -1;
          if (!a.time && b.time) return 1;
          return a.createdAt - b.createdAt;
        });

      document.getElementById('strip-title-count').textContent = `${t.habitsStrip} (${dateHabits.length})`;
      const completedCount = dateHabits.filter(h => h.completed).length;
      document.getElementById('strip-completed-count').textContent = dateHabits.length > 0 ? `✓ ${completedCount} ${t.completed}` : '';
      
      const lockedBadge = document.getElementById('strip-locked-badge');
      if (isPast) lockedBadge.classList.remove('hidden');
      else lockedBadge.classList.add('hidden');

      if (dateHabits.length === 0) {
        stripContainer.innerHTML = `
          <div class="w-full bg-white dark:bg-slate-900 border border-dashed border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">
            ${t.noHabits}
          </div>
        `;
        return;
      }

      stripContainer.innerHTML = dateHabits.map(habit => `
        <div id="habit-card-${habit.id}" class="group shrink-0 w-72 sm:w-80 rounded-2xl p-4 transition-all border flex flex-col justify-between relative ${
          habit.completed
            ? 'bg-slate-50 dark:bg-slate-900/40 border-emerald-300 shadow-xs'
            : 'bg-white dark:bg-slate-900 border-slate-200 shadow-sm hover:shadow-md'
        }">
          <div class="flex items-start gap-3">
            <button
              type="button"
              ${isPast ? 'disabled' : ''}
              onclick="toggleHabit('${habit.id}')"
              class="mt-0.5 w-6 h-6 rounded-lg flex items-center justify-center transition-all shrink-0 ${
                isPast ? 'cursor-not-allowed opacity-80' : 'cursor-pointer'
              } ${
                habit.completed ? 'bg-emerald-600 text-white' : 'border-2 border-slate-300 hover:border-emerald-500 bg-white'
              }"
            >
              ${habit.completed ? '✓' : isPast ? '🔒' : ''}
            </button>
            <div class="min-w-0 flex-1">
              <h3 class="font-semibold text-sm leading-snug break-words ${
                habit.completed ? 'text-slate-400 line-through' : 'text-slate-800 dark:text-slate-100'
              }">
                ${escapeHtml(habit.title)}
              </h3>
            </div>
          </div>

          <div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
            <div class="flex items-center gap-1.5 flex-wrap">
              ${habit.time ? `<span class="text-slate-600 bg-slate-100 px-2 py-0.5 rounded-lg font-mono">🕒 ${habit.time}</span>` : ''}
              ${habit.isHabit ? `<span class="text-amber-800 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded text-[10px] font-semibold">🔄 ${habit.habitDurationLabel || 'عادة'}</span>` : ''}
              ${habit.reminderEnabled ? `<span class="text-teal-700 bg-teal-50 border border-teal-200 px-2 py-0.5 rounded text-[10px]">🔔 ${getRemainingTimeText(habit.date, habit.time)}</span>` : ''}
            </div>

            ${isPast ? `
              <span class="p-1.5 text-slate-400 bg-slate-100 rounded-lg cursor-not-allowed">🔒</span>
            ` : `
              <button type="button" onclick="promptDeleteHabit('${habit.id}', '${habit.habitGroupId || ''}')" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition cursor-pointer">
                🗑️
              </button>
            `}
          </div>
        </div>
      `).join('');
    }

    window.toggleHabit = function(id) {
      if (isPastDate(selectedDate)) return;
      const h = habits.find(item => item.id === id);
      if (h) {
        h.completed = !h.completed;
        saveHabits();
        renderApp();

      if (groupId) {

        renderApp();

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // --- Global Controls Setup ---
    document.getElementById('lang-menu-btn').onclick = () => {
      const dd = document.getElementById('lang-dropdown');
      dd.classList.toggle('hidden');
      dd.innerHTML = LANGUAGES.map(l => `
        <button type="button" onclick="changeLanguage('${l.code}')" class="w-full px-3 py-2 text-xs flex items-center justify-between hover:bg-slate-50 ${currentLang === l.code ? 'font-bold text-emerald-600' : ''}">
          <span class="flex items-center gap-2"><span>${l.flag}</span> <span>${l.name}</span></span>
          ${currentLang === l.code ? '✓' : ''}
        </button>
      `).join('');
    };

    window.changeLanguage = function(code) {
      currentLang = code;
      localStorage.setItem('habits_organizer_selected_lang_v1', code);
      document.getElementById('lang-dropdown').classList.add('hidden');
      renderApp();
    };

    document.getElementById('bell-btn').onclick = () => {
      document.getElementById('notification-dropdown').classList.toggle('hidden');
    };

    document.getElementById('open-config-btn').onclick = () => openConfigModal();

    document.getElementById('prev-day-btn').onclick = () => {
      const d = parseDateKey(selectedDate);
      d.setDate(d.getDate() - 1);
      selectedDate = formatToDateKey(d);
      renderApp();
      scrollToDateSlot(selectedDate);
    };

    document.getElementById('next-day-btn').onclick = () => {
      const d = parseDateKey(selectedDate);
      d.setDate(d.getDate() + 1);
      selectedDate = formatToDateKey(d);
      renderApp();
      scrollToDateSlot(selectedDate);
    };

    document.getElementById('back-today-btn').onclick = () => {
      selectedDate = getTodayDateKey();
      renderApp();
      scrollToDateSlot(selectedDate);
    };

    document.getElementById('native-date-picker').onchange = (e) => {
      if (e.target.value) {
        selectedDate = e.target.value;
        renderApp();
        scrollToDateSlot(selectedDate);
      }
    };

    document.getElementById('mark-all-read-btn').onclick = () => {
      notifications.forEach(n => n.read = true);
      saveNotifications();
      renderApp();
    };

    document.getElementById('clear-all-notifs-btn').onclick = () => {
      notifications = [];
      saveNotifications();
      renderApp();
    };

    document.getElementById('scroll-right-btn').onclick = () => {
      document.getElementById('habits-scroll-strip').scrollBy({ left: 300, behavior: 'smooth' });
    };
    document.getElementById('scroll-left-btn').onclick = () => {
      document.getElementById('habits-scroll-strip').scrollBy({ left: -300, behavior: 'smooth' });
    };

    // Close dropdowns on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#lang-menu-btn') && !e.target.closest('#lang-dropdown')) {
        document.getElementById('lang-dropdown').classList.add('hidden');
      }
      if (!e.target.closest('#bell-btn') && !e.target.closest('#notification-dropdown')) {
        document.getElementById('notification-dropdown').classList.add('hidden');
      }
    });

    // Check reminders periodically
    setInterval(() => {
      const now = Date.now();
      habits.forEach(h => {
        if (h.reminderEnabled && !h.notified && !h.completed) {
          const target = parseDateKey(h.date);
          if (h.time && h.time.includes(':')) {
            const [hr, min] = h.time.split(':').map(Number);
            target.setHours(hr, min, 0, 0);
          } else {
            target.setHours(9, 0, 0, 0);
          }
          const trigger = target.getTime() - ((h.reminderOffsetMinutes || 0) * 60000);
          if (trigger <= now) {
            h.notified = true;
            h.reminderEnabled = false;
            saveHabits();
            notifications.unshift({
              id: 'notif_' + Date.now(),
              habitId: h.id,
              habitTitle: h.title,
              habitDate: h.date,
              habitTime: h.time,
              timestamp: now,
              read: false,
              explanatoryMessage: getRemainingTimeText(h.date, h.time)
            });
            saveNotifications();
            if ('Notification' in window && Notification.permission === 'granted') {
              new Notification(h.title, { body: getRemainingTimeText(h.date, h.time), icon: '/icon.jpg' });
            }
            renderApp();
          }
        }
      });
    }, 15000);

    // Initial render
    renderApp();
    scrollToDateSlot(selectedDate);
  </script>
</body>
</html>
