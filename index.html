
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إنجازاتي - تتبع المهام والعادات اليومية</title>
  
  <!-- خط كايرا العربي الحديث من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- مكتبة الأيقونات العالمية Font Awesome 6 عبر CDN حي وسريع -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- مكتبة Tailwind CSS عبر CDN الرسمي -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- تنسيقات مخصصة للأجهزة الذكية -->
  <style>
    * {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif !important;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .app-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      border-radius: 1.5rem;
    }
    .btn-touch {
      min-height: 44px;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col pb-24 selection:bg-brand-100 selection:text-brand-900">

  <!-- ==================== الشريط العلوي (Header) ==================== -->
  <header class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200/80 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <!-- الشعار والعنوان -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-700 to-brand-500 text-white flex items-center justify-center text-xl shadow-md shadow-brand-500/20 shrink-0">
          <i class="fa-solid fa-calendar-check"></i>
        </div>
        <div>
          <h1 id="ui-title" class="text-base sm:text-lg font-black text-slate-900 leading-tight">إنجازاتي</h1>
          <p id="ui-subtitle" class="text-[11px] sm:text-xs text-slate-500 font-semibold">تتبع المهام والعادات اليومية</p>
        </div>
      </div>

      <!-- أدوات التحكم: اللغة والإشعارات -->
      <div class="flex items-center gap-2">
        <!-- قائمة اللغات -->
        <div class="relative">
          <select id="lang-select" onchange="changeLanguage(this.value)" class="text-xs font-bold bg-slate-100 hover:bg-slate-200/80 text-slate-700 border border-slate-200 rounded-xl px-2.5 py-2 outline-none cursor-pointer transition">
            <option value="ar">🇸🇦 العربية</option>
            <option value="en">🇬🇧 English</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
            <option value="de">🇩🇪 Deutsch</option>
          </select>
        </div>

        <!-- زر الإشعارات والتنبيهات -->
        <div class="relative">
          <button id="notif-btn" type="button" onclick="toggleNotificationsMenu()" class="relative w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 border border-slate-200 flex items-center justify-center text-sm transition active:scale-95 cursor-pointer" title="الإشعارات">
            <i class="fa-solid fa-bell text-base"></i>
            <span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-black rounded-full min-w-5 h-5 px-1 flex items-center justify-center ring-2 ring-white">0</span>
          </button>

          <!-- قائمة الإشعارات المنسدلة -->
          <div id="notif-dropdown" class="hidden fixed sm:absolute top-16 sm:top-12 inset-x-4 sm:inset-x-auto sm:left-0 sm:right-auto rtl:sm:left-0 rtl:sm:right-auto ltr:sm:right-0 ltr:sm:left-auto w-auto sm:w-84 max-w-sm bg-white border border-slate-200 rounded-3xl p-4 shadow-2xl z-50">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">
              <span class="font-bold text-xs text-slate-800 flex items-center gap-1.5">
                <i class="fa-solid fa-bell text-brand-600"></i>
                <span id="ui-notif-title">سجل التنبيهات والإشعارات</span>
              </span>
              <button onclick="clearNotifications()" class="text-[11px] font-bold text-rose-600 hover:underline cursor-pointer">مسح الكل</button>
            </div>
            <div id="notif-items-list" class="max-h-64 overflow-y-auto space-y-2 text-xs"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== المحتوى الرئيسي ==================== -->
  <main class="max-w-4xl w-full mx-auto px-4 pt-4 sm:pt-6 space-y-4 sm:space-y-5">

    <!-- 1. بطاقة شريط الأيام والتقويم ونسبة الإنجاز -->
    <div class="app-card p-4 sm:p-5">
      <!-- شريط معلومات اليوم وأزرار التنقل -->
      <div class="flex items-center justify-between gap-2 pb-3.5 border-b border-slate-100">
        <div>
          <div class="flex items-center gap-2">
            <h2 id="active-date-display" class="text-base sm:text-lg font-black text-slate-900 tracking-tight">...</h2>
            <span id="active-day-relative" class="text-xs font-black px-2.5 py-0.5 rounded-full bg-brand-100 text-brand-800 border border-brand-200"></span>
          </div>
          <p id="active-date-stats" class="text-xs text-slate-500 font-medium mt-0.5">0 مهمة لهذا اليوم</p>
        </div>

        <div class="flex items-center gap-2">
          <!-- زر اليوم السريع -->
          <button type="button" onclick="jumpToToday()" class="btn-touch px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-xs active:scale-95 transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-calendar-day"></i>
            <span id="ui-today-btn">اليوم</span>
          </button>
          
          <!-- مفكرة اختيار أي تاريخ مخصص -->
          <div class="relative">
            <input type="date" id="native-calendar-input" onchange="onDatePicked(this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10" />
            <button type="button" class="btn-touch w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 flex items-center justify-center transition active:scale-95">
              <i class="fa-solid fa-calendar-alt text-base"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- شريط الأيام الأفقي القابل للتمرير والسحب -->
      <div class="relative mt-3">
        <div id="days-carousel" class="flex gap-2 overflow-x-auto py-2 px-0.5 no-scrollbar scroll-smooth"></div>
      </div>

      <!-- شريط نسبة الإنجاز المئوية لليوم المحدد -->
      <div class="mt-3 pt-3 border-t border-slate-100 flex items-center gap-3">
        <div class="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200/50">
          <div id="completion-bar" class="bg-gradient-to-r from-brand-500 to-teal-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="completion-percent" class="text-sm font-black font-mono text-brand-700 min-w-10 text-center">0%</span>
      </div>
    </div>

    <!-- 2. صندوق إضافة مهمة جديدة أو عادة متكررة -->
    <div class="app-card p-4 sm:p-5 space-y-4">
      
      <!-- اقتراحات سريعة بلمسة واحدة مع أيقونات FontAwesome -->
      <div class="space-y-1.5">
        <span class="text-[11px] font-bold text-slate-500 flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles text-brand-600"></i>
          <span id="ui-suggestions-title">اقتراحات سريعة للمهام الشائعة:</span>
        </span>
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
          <button type="button" onclick="applySuggestion('صلاة الفجر في وقتها', '05:30')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-brand-50 hover:text-brand-800 border border-slate-200 text-slate-700 font-bold whitespace-nowrap transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-mosque text-emerald-600"></i> صلاة الفجر
          </button>
          <button type="button" onclick="applySuggestion('شرب 2 لتر ماء', '09:00')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-brand-50 hover:text-brand-800 border border-slate-200 text-slate-700 font-bold whitespace-nowrap transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-glass-water text-blue-500"></i> شرب ماء
          </button>
          <button type="button" onclick="applySuggestion('قراءة ورد القرآن أو كتاب', '20:00')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-brand-50 hover:text-brand-800 border border-slate-200 text-slate-700 font-bold whitespace-nowrap transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-book-open text-amber-600"></i> قراءة ورد
          </button>
          <button type="button" onclick="applySuggestion('تمارين رياضية صباحية (كارديو)', '07:00')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-brand-50 hover:text-brand-800 border border-slate-200 text-slate-700 font-bold whitespace-nowrap transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-dumbbell text-rose-500"></i> رياضة
          </button>
          <button type="button" onclick="applySuggestion('النوم مبكراً بدون هاتف', '22:30')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-brand-50 hover:text-brand-800 border border-slate-200 text-slate-700 font-bold whitespace-nowrap transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-moon text-indigo-500"></i> نوم مبكر
          </button>
        </div>
      </div>

      <!-- حقول إدخال اسم المهمة والموعد -->
      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <input type="text" id="task-title-input" placeholder="اكتب اسم المهمة أو العادة الجديدة..." class="w-full h-12 pl-4 pr-11 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:border-brand-600 focus:bg-white transition" />
          <span class="absolute inset-y-0 right-3.5 flex items-center text-slate-400">
            <i class="fa-solid fa-pen-to-square"></i>
          </span>
        </div>
        <div class="relative w-full sm:w-44">
          <input type="time" id="task-time-input" class="w-full h-12 px-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-black text-slate-800 outline-none focus:border-brand-600 focus:bg-white transition" />
        </div>
      </div>

      <!-- لوحة الاختيار المخصص لوقت التنبيه بالأيام والساعات والدقائق -->
      <div class="bg-brand-50/80 border border-brand-200 rounded-2xl p-3.5 sm:p-4 space-y-2.5">
        <div class="flex items-center justify-between text-xs font-bold text-brand-900">
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-stopwatch text-brand-700 text-sm"></i>
            <span id="ui-reminder-title">وقت التنبيه قبل الموعد:</span>
          </span>
          <span id="custom-offset-preview" class="font-mono bg-white px-2.5 py-0.5 rounded-lg border border-brand-300 text-brand-800 font-black">عند الموعد (0د)</span>
        </div>

        <div class="grid grid-cols-3 gap-2 sm:gap-3 text-center">
          <!-- الأيام -->
          <div class="bg-white p-2 sm:p-2.5 rounded-xl border border-brand-200 shadow-2xs">
            <span class="text-[11px] font-bold text-slate-500 block mb-1">أيام</span>
            <div class="flex items-center justify-between gap-1">
              <button type="button" onclick="adjustOffset('days', -1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer"><i class="fa-solid fa-minus text-xs"></i></button>
              <input type="number" id="rem-days" min="0" max="30" value="0" oninput="onOffsetInputChange()" class="w-full text-center font-black text-sm outline-none bg-transparent">
              <button type="button" onclick="adjustOffset('days', 1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer"><i class="fa-solid fa-plus text-xs"></i></button>
            </div>
          </div>
          <!-- الساعات -->
          <div class="bg-white p-2 sm:p-2.5 rounded-xl border border-brand-200 shadow-2xs">
            <span class="text-[11px] font-bold text-slate-500 block mb-1">ساعات</span>
            <div class="flex items-center justify-between gap-1">
              <button type="button" onclick="adjustOffset('hours', -1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer"><i class="fa-solid fa-minus text-xs"></i></button>
              <input type="number" id="rem-hours" min="0" max="23" value="0" oninput="onOffsetInputChange()" class="w-full text-center font-black text-sm outline-none bg-transparent">
              <button type="button" onclick="adjustOffset('hours', 1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer"><i class="fa-solid fa-plus text-xs"></i></button>
            </div>
          </div>
          <!-- الدقائق -->
          <div class="bg-white p-2 sm:p-2.5 rounded-xl border border-brand-200 shadow-2xs">
            <span class="text-[11px] font-bold text-slate-500 block mb-1">دقائق</span>
            <div class="flex items-center justify-between gap-1">
              <button type="button" onclick="adjustOffset('mins', -5)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer"><i class="fa-solid fa-minus text-xs"></i></button>
              <input type="number" id="rem-mins" min="0" max="59" value="15" oninput="onOffsetInputChange()" class="w-full text-center font-black text-sm outline-none bg-transparent">
              <button type="button" onclick="adjustOffset('mins', 5)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer"><i class="fa-solid fa-plus text-xs"></i></button>
            </div>
          </div>
        </div>
      </div>

      <!-- ميزة بناء العادة المتكررة (21 يوماً / أيام مخصصة) -->
      <div class="bg-amber-50/70 border border-amber-200 rounded-2xl p-3.5 space-y-3">
        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" id="habit-enable-checkbox" onchange="toggleHabitOptions(this.checked)" class="w-5 h-5 accent-amber-600 rounded-lg cursor-pointer">
          <span class="text-xs sm:text-sm font-bold text-amber-950 flex items-center gap-1.5">
            <i class="fa-solid fa-arrows-rotate text-amber-600"></i>
            <span id="ui-habit-label">برمجة المهمة كعادة متكررة (21 يوماً أو أيام مخصصة)</span>
          </span>
        </label>

        <div id="habit-options-panel" class="hidden space-y-2.5 pt-2 border-t border-amber-200/80">
          <!-- اختيار أيام الأسبوع لتكرار العادة -->
          <div class="flex items-center justify-between gap-1">
            <span class="text-[11px] font-bold text-amber-900">أيام التكرار:</span>
            <button type="button" onclick="selectAllWeekDays()" class="text-[11px] font-bold text-amber-700 hover:underline">كل الأيام</button>
          </div>
          <div id="weekdays-buttons" class="grid grid-cols-7 gap-1"></div>

          <!-- مدة بناء العادة (21 يوماً، شهر، شهرين) -->
          <div class="pt-1">
            <span class="text-[11px] font-bold text-amber-900 block mb-1">مدة بناء العادة:</span>
            <div class="grid grid-cols-3 gap-1.5 text-xs">
              <button type="button" onclick="setHabitDuration(21)" class="btn-touch py-2 rounded-xl bg-amber-500 text-white font-black shadow-xs flex items-center justify-center gap-1">
                <i class="fa-solid fa-bullseye"></i> 21 يوماً
              </button>
              <button type="button" onclick="setHabitDuration(30)" class="btn-touch py-2 rounded-xl bg-white border border-amber-300 text-amber-900 font-bold hover:bg-amber-100/50 flex items-center justify-center gap-1">
                <i class="fa-solid fa-calendar-check"></i> شهر
              </button>
              <button type="button" onclick="setHabitDuration(60)" class="btn-touch py-2 rounded-xl bg-white border border-amber-300 text-amber-900 font-bold hover:bg-amber-100/50 flex items-center justify-center gap-1">
                <i class="fa-solid fa-calendar-plus"></i> شهرين
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- زر الحفظ والإضافة -->
      <button type="button" onclick="submitNewTask()" class="btn-touch w-full py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 active:scale-98 text-white font-black text-sm sm:text-base shadow-lg shadow-brand-600/20 transition flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-plus-circle text-lg"></i>
        <span id="ui-submit-btn">حفظ وإضافة المهمة</span>
      </button>
    </div>

    <!-- 3. قائمة بطاقات المهام لليوم المحدد -->
    <div class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h3 id="tasks-header-count" class="text-xs sm:text-sm font-bold text-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-list-check text-brand-600"></i>
          <span>قائمة المهام (0)</span>
        </h3>
        <span id="tasks-header-done" class="text-xs font-bold text-brand-700 bg-brand-50 border border-brand-200 px-2.5 py-0.5 rounded-full font-mono">0 مكتملة</span>
      </div>

      <!-- الحاوية الممتلئة بالمهام -->
      <div id="tasks-container" class="space-y-2.5"></div>
    </div>

  </main>

  <!-- ==================== شريط الإحصائيات السفلي العائم ==================== -->
  <div class="fixed bottom-3 inset-x-4 max-w-sm mx-auto bg-white/95 backdrop-blur-md border border-brand-300 rounded-2xl py-2.5 px-4 shadow-xl flex items-center justify-between z-30 transition">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-brand-500 animate-pulse"></span>
      <span class="text-xs font-bold text-slate-800" id="ui-bottom-title">المهمات المنجزة لليوم:</span>
    </div>
    <div class="flex items-center gap-1.5 font-mono">
      <span id="bottom-today-count" class="text-base font-black text-brand-700 tracking-tight">0 / 0</span>
      <span class="text-[11px] text-slate-500 font-sans" id="ui-bottom-done-text">مكتملة</span>
    </div>
  </div>

  <!-- ==================== نافذة تأكيد حذف العادة المتكررة ==================== -->
  <div id="delete-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
