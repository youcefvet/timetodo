<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Timetodo">
  <title>Timetodo - منظّم المهمات اليومية والعادات</title>
  <meta name="description" content="تطبيق لتنظيم المهمات اليومية مع شريط قابل للتمرير، وخاصية التذكير والإشعارات ودعم اللغات وبرمجة العادات يعمل بدون إنترنت (PWA).">
  <meta property="og:title" content="Timetodo - منظّم المهمات اليومية والعادات">
  <meta property="og:description" content="تطبيق لتنظيم المهمات اليومية مع شريط قابل للتمرير، وخاصية التذكير والإشعارات ودعم اللغات وبرمجة العادات يعمل بدون إنترنت (PWA).">

  <!-- ملف PWA Web App Manifest الداخلي وأيقونات التطبيق لشاشات التمهيد والبدء -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">

  <script type="application/json" id="app-pwa-manifest">
  {
    "id": "/",
    "name": "Timetodo - منظم المهام والعادات",
    "short_name": "Timetodo",
    "description": "تطبيق لتنظيم المهمات اليومية والعادات وتذكيرات المواعيد يعمل بدون إنترنت (PWA).",
    "start_url": "/",
    "scope": "/",
    "display": "standalone",
    "orientation": "portrait-primary",
    "background_color": "#f8fafc",
    "theme_color": "#0d9488",
    "lang": "ar",
    "dir": "rtl",
    "icons": [
      {
        "src": "/pwa-192x192.png",
        "sizes": "192x192",
        "type": "image/png",
        "purpose": "any maskable"
      },
      {
        "src": "/pwa-512x512.png",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any maskable"
      },
      {
        "src": "/pwa-maskable-512x512.png",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any maskable"
      }
    ]
  }
  </script>
  <script>
    // تفعيل manifest تلقائياً عبر Blob URL إذا فُتح الملف مباشرة كملف منفرد على GitHub
    try {
      const manifestScript = document.getElementById('app-pwa-manifest');
      const manifestLink = document.querySelector('link[rel="manifest"]');
      if (manifestScript && manifestLink && (window.location.protocol === 'file:' || !window.location.host)) {
        const blob = new Blob([manifestScript.textContent], { type: 'application/manifest+json' });
        manifestLink.href = URL.createObjectURL(blob);
      }
    } catch(e) {}
  </script>

  <!-- خطوط Google Fonts: Cairo للعربية، Inter للإنجليزية، و Plus Jakarta Sans لشعار Timetodo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- مكتبة FontAwesome 6 (CDN مباشر وحي) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- مكتبة Tailwind CSS (CDN مباشر للتشغيل الفوري والتصميم التجاوبي) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a'
            }
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            sans: ['Cairo', 'Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- ملف التنسيقات المدمجة والمحلية -->

  <style>
    html, body {
      overscroll-behavior-y: none;
      -webkit-overscroll-behavior-y: none;
    }
    * {
      font-family: 'Cairo', 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      overscroll-behavior-y: none;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .btn-touch {
      min-height: 44px;
      touch-action: manipulation;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.08), 0 8px 10px -6px rgba(13, 148, 136, 0.04);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col pb-12 antialiased">

  <!-- ==================== 1. الشريط العلوي التجاوبي ==================== -->
  <header class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200/90 shadow-xs">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <!-- اسم التطبيق Timetodo بخط أنيق وعصري ومضبوط الاتجاه دائماً -->
      <div class="flex items-center select-none py-0.5" dir="ltr" style="direction: ltr !important; unicode-bidi: isolate;">
        <span class="text-2xl sm:text-[26px] font-black tracking-tight leading-none text-slate-900" style="font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; letter-spacing: -0.02em;">
          Timetodo
        </span>
      </div>

      <!-- أدوات التحكم: زر التثبيت PWA، اختيار اللغة، وسجل الإشعارات الموحد -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- زر تثبيت التطبيق كـ PWA -->
        <button type="button" id="btn-pwa-install" onclick="window.triggerPWAInstall()" class="hidden h-9 px-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 active:scale-95 text-white text-xs font-black items-center gap-1.5 transition cursor-pointer shadow-xs" title="تثبيت التطبيق على جهازك">
          <i class="fa-solid fa-download text-xs"></i>
          <span id="ui-install-text" class="hidden sm:inline">تثبيت</span>
        </button>

        <!-- زر واختيار اللغة المحسّن والأنيق -->
        <div class="relative h-9 flex items-center bg-slate-100 hover:bg-slate-200 border border-slate-200/90 rounded-xl px-2.5 transition active:scale-98 shadow-2xs group focus-within:ring-2 focus-within:ring-teal-500/25">
          <i class="fa-solid fa-globe text-teal-600 text-xs shrink-0 pointer-events-none me-1.5 transition-transform group-hover:rotate-12"></i>
          <select id="lang-select" onchange="window.changeLanguage(this.value)" class="h-full text-xs font-bold text-slate-700 bg-transparent outline-none cursor-pointer pe-4 appearance-none focus:outline-none">
            <option value="ar">العربية 🇸🇦</option>
            <option value="en">English 🇬🇧</option>
            <option value="zh">中文 🇨🇳</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="es">Español 🇪🇸</option>
          </select>
          <i class="fa-solid fa-chevron-down text-[9px] text-slate-400 pointer-events-none absolute end-2 top-1/2 -translate-y-1/2 transition-transform group-focus-within:rotate-180"></i>
        </div>

        <!-- زر الإشعارات الموحد مع شارة التنبيهات غير المقروءة -->
        <button type="button" id="btn-notif-history" onclick="window.toggleNotificationsMenu()" class="relative w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 flex items-center justify-center transition active:scale-95 cursor-pointer" title="سجل التنبيهات">
          <i class="fa-regular fa-bell text-sm"></i>
          <span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-black rounded-full min-w-4 h-4 px-1 flex items-center justify-center ring-2 ring-white">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 2. قائمة الإشعارات المنسدلة ==================== -->
  <div id="notif-dropdown" class="hidden fixed top-16 inset-x-4 max-w-sm mx-auto bg-white border border-slate-200 rounded-3xl p-4 shadow-2xl z-50">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2.5">
      <span class="font-bold text-xs text-slate-800 flex items-center gap-1.5">
        <i class="fa-solid fa-bell text-teal-600 text-sm"></i>
        <span id="ui-notif-title">سجل التنبيهات والإشعارات</span>
      </span>
      <div class="flex items-center gap-2">
        <button type="button" id="ui-clear-notifs" onclick="window.clearNotifications()" class="text-[11px] text-rose-600 hover:text-rose-700 font-bold cursor-pointer">مسح الكل</button>
        <button type="button" onclick="window.toggleNotificationsMenu()" class="text-slate-400 hover:text-slate-600 cursor-pointer p-1">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- شريط تفعيل إشعارات المتصفح بسويتش Toggle Switch أنيق وعصري -->
    <div id="notif-perm-banner" class="mb-2.5 p-3 rounded-2xl bg-slate-50 border border-slate-200 transition">
      <div class="flex items-center justify-between gap-3">
        <div onclick="window.toggleNotificationSwitch()" class="flex items-center gap-2.5 min-w-0 cursor-pointer select-none flex-1">
          <div id="notif-banner-icon-wrapper" class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center shrink-0 transition">
            <i id="notif-banner-icon" class="fa-solid fa-bell text-slate-400 text-xs transition"></i>
          </div>
          <div class="min-w-0">
            <span id="notif-banner-text" class="font-bold text-slate-800 truncate block text-xs">تفعيل إشعارات المتصفح</span>
            <span id="notif-banner-subtext" class="text-[10px] text-slate-500 font-medium block">تنبيهات فورية للمهام والعادات</span>
          </div>
        </div>
        
        <!-- Toggle Switch UI (رمادي عند الإيقاف، أخضر عند التشغيل) -->
        <label class="relative inline-flex items-center justify-center cursor-pointer shrink-0 select-none w-11 h-6">
          <input type="checkbox" id="notif-toggle-switch" onchange="window.handleNotificationToggleChange(this.checked)" class="sr-only peer absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
          <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:bg-emerald-500 transition-colors after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full shadow-inner pointer-events-none"></div>
        </label>
      </div>

      <!-- تنبيه إرشادي لطيف يظهر في حال كان إذن المتصفح محظوراً -->
      <div id="notif-perm-hint" class="hidden mt-2 pt-2 border-t border-slate-200/80 text-[10px] text-amber-700 flex items-start gap-1.5 leading-relaxed">
        <i class="fa-solid fa-circle-exclamation mt-0.5 shrink-0 text-amber-600"></i>
        <span id="notif-perm-hint-text">تنبيه: الإشعارات محظورة في إعدادات المتصفح. لتلقي إشعارات النظام، اضغط على رمز القفل بجانب الرابط واسمح بالإشعارات.</span>
      </div>
    </div>
    <div id="notif-list" class="max-h-64 overflow-y-auto space-y-2 text-xs">
      <!-- يتم تعبئة الإشعارات عبر JS -->
    </div>
  </div>

  <!-- ==================== 3. المحتوى الرئيسي ==================== -->
  <main class="max-w-2xl mx-auto px-4 py-4 w-full space-y-4 flex-1">

    <!-- بطاقة التحكم بالتاريخ والشريط الأفقي القابل للتمرير -->
    <div class="bg-white rounded-3xl p-3.5 sm:p-4 border border-slate-200 shadow-xs space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <button type="button" onclick="window.jumpToToday()" class="btn-touch px-3 py-1.5 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-800 border border-teal-200 text-xs font-black flex items-center gap-1.5 transition active:scale-95 cursor-pointer">
            <i class="fa-solid fa-calendar-day text-teal-600"></i>
            <span id="ui-today-btn">اليوم</span>
          </button>
          <div class="flex items-center gap-1.5">
            <span id="active-date-display" class="text-sm font-black font-mono text-slate-800">2026-09-27</span>
            <span id="active-day-relative" class="text-[11px] font-bold bg-teal-600 text-white px-2 py-0.5 rounded-lg shadow-2xs">اليوم</span>
          </div>
        </div>

        <!-- زر التقويم لاختيار أي يوم -->
        <label id="ui-other-date-btn" class="btn-touch px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 text-xs font-bold flex items-center gap-1.5 cursor-pointer transition active:scale-95">
          <i class="fa-regular fa-calendar text-teal-600"></i>
          <span id="ui-other-date-text" class="hidden sm:inline">تاريخ آخر</span>
          <input type="date" id="native-calendar-input" onchange="window.onDatePicked(this.value)" class="sr-only" />
        </label>
      </div>

      <!-- شريط الأيام الأفقي المتجاوب والقابل للتمرير -->
      <div id="days-carousel" class="flex gap-2 overflow-x-auto no-scrollbar py-1 scroll-smooth">
        <!-- يتم توليد الأيام برمجياً بواسطة JS -->
      </div>
    </div>

    <!-- بطاقة إضافة مهمة جديدة مع خيارات التنبيه والعادة -->
    <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 custom-shadow space-y-3.5">
      
      <!-- حقل إدخال عنوان المهمة -->
      <div>
        <label for="task-title-input" id="ui-task-input-label" class="text-xs font-bold text-slate-600 mb-1.5 block">ما الذي تريد إنجازه في هذا اليوم؟</label>
        <div class="relative">
          <input 
            type="text" 
            id="task-title-input" 
            placeholder="اكتب مهمتك هنا..." 
            onkeydown="if(event.key==='Enter') window.submitNewTask()"
            class="w-full h-12 px-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 placeholder:text-slate-400 outline-none focus:border-teal-600 focus:bg-white transition"
          />
        </div>
      </div>

      <!-- اختيار وقت المهمة -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pt-1 border-t border-slate-100">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
            <i class="fa-regular fa-clock text-sm"></i>
          </div>
          <div>
            <span id="ui-task-time-title" class="text-xs font-bold text-slate-800 block">وقت المهمة المحدد</span>
            <span id="ui-task-time-subtitle" class="text-[11px] text-slate-500 font-medium">سيتم التنبيه تلقائياً عند حلول هذا الموعد</span>
          </div>
        </div>
        <div class="w-full sm:w-44">
          <input type="time" id="task-time-input" class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-black text-slate-800 outline-none focus:border-teal-600 focus:bg-white transition cursor-pointer" />
        </div>
      </div>

      <!-- خيار إرسال إشعار قبل وقت المهمة -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-2.5">
        <label class="flex items-center justify-between cursor-pointer select-none">
          <div class="flex items-center gap-2.5">
            <input type="checkbox" id="advance-rem-enable" onchange="window.toggleAdvanceReminder(this.checked)" class="w-5 h-5 accent-teal-600 rounded-lg cursor-pointer">
            <span class="text-xs sm:text-sm font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-stopwatch text-teal-600 text-sm"></i>
              <span id="ui-advance-rem-label">إرسال إشعار قبل وقت المهمة</span>
            </span>
          </div>
          <span id="custom-offset-preview" class="hidden text-xs font-mono bg-teal-100 text-teal-900 px-2 py-0.5 rounded-lg font-black border border-teal-200"></span>
        </label>

        <!-- لوحة تحديد وقت الإشعار المسبق -->
        <div id="advance-rem-panel" class="hidden pt-2 border-t border-slate-200 space-y-2">
          <div class="grid grid-cols-3 gap-2 text-center">
            <!-- الأيام -->
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs">
              <span id="ui-rem-days-label" class="text-[11px] font-bold text-slate-500 block mb-1">أيام</span>
              <div class="flex items-center justify-between gap-1">
                <button type="button" onclick="window.adjustOffset('days', -1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer text-sm">-</button>
                <input type="number" id="rem-days" min="0" max="30" value="0" oninput="window.onOffsetInputChange()" class="w-full text-center font-black text-sm outline-none bg-transparent">
                <button type="button" onclick="window.adjustOffset('days', 1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer text-sm">+</button>
              </div>
            </div>
            <!-- الساعات -->
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs">
              <span id="ui-rem-hours-label" class="text-[11px] font-bold text-slate-500 block mb-1">ساعات</span>
              <div class="flex items-center justify-between gap-1">
                <button type="button" onclick="window.adjustOffset('hours', -1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer text-sm">-</button>
                <input type="number" id="rem-hours" min="0" max="23" value="0" oninput="window.onOffsetInputChange()" class="w-full text-center font-black text-sm outline-none bg-transparent">
                <button type="button" onclick="window.adjustOffset('hours', 1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer text-sm">+</button>
              </div>
            </div>
            <!-- الدقائق -->
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs">
              <span id="ui-rem-mins-label" class="text-[11px] font-bold text-slate-500 block mb-1">دقائق</span>
              <div class="flex items-center justify-between gap-1">
                <button type="button" onclick="window.adjustOffset('mins', -5)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer text-sm">-</button>
                <input type="number" id="rem-mins" min="0" max="59" value="15" oninput="window.onOffsetInputChange()" class="w-full text-center font-black text-sm outline-none bg-transparent">
                <button type="button" onclick="window.adjustOffset('mins', 5)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center cursor-pointer text-sm">+</button>
